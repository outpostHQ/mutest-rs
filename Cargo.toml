cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [
    "cargo-mutest",
    "mutest-driver",
    "mutest-driver-cli",
    "mutest-emit",
    "mutest-exit-code",
    "mutest-inspector",
    "mutest-json",
    "mutest-operators",
    "mutest-runtime",
    "mutest-runtime-embedded-target-stub",
    "mutest-runtime-embedded-host-driver",
    "test-metadata-shim",
    "tests",
]

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
inefficient_to_string = "warn"
mem_forget = "warn"
rc_buffer = "warn"

# Full metadata in every rlib, an identity namespace for the injected runtime's dependencies, and the trait
# solver the runtime's `generic_const_exprs` needs, stated so rustc need not warn. Applied on top of `RUSTFLAGS`.
[profile.dev]
rustflags = ["-Zembed-metadata=yes", "-Cmetadata=mutest-runtime-private-v1", "-Znext-solver=coherence"]

[profile.release]
rustflags = ["-Zembed-metadata=yes", "-Cmetadata=mutest-runtime-private-v1", "-Znext-solver=coherence"]
