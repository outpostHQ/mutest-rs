cargo-features = ["profile-rustflags"]

[workspace]
resolver = "3"
members = [
    "cargo-mutest",
    "mutest-driver",
    "mutest-driver-cli",
    "mutest-edition-2021",
    "mutest-emit",
    "mutest-exit-code",
    "mutest-inspector",
    "mutest-json",
    "mutest-operators",
    "mutest-runtime",
    "mutest-runtime-embedded-target-stub",
    "mutest-runtime-embedded-host-driver",
    "test-metadata-shim",
    "tests",
]
# What `cargo mutest run` mutates at the root: the other crates run the driver as a child process, which no mutant reaches.
default-members = ["mutest-runtime"]
# The crates that bin/corpus fetches into target/corpus are their own workspaces.
exclude = ["target"]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(mutest)"] }

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
inefficient_to_string = "warn"
mem_forget = "warn"
rc_buffer = "warn"

# Full metadata in every rlib, and an identity namespace for the injected runtime's dependencies.
# Applied on top of `RUSTFLAGS`.
[profile.dev]
rustflags = ["-Zembed-metadata=yes", "-Cmetadata=mutest-runtime-private-v1"]

[profile.release]
rustflags = ["-Zembed-metadata=yes", "-Cmetadata=mutest-runtime-private-v1"]
