[workspace]
resolver = "3"
members = [
    "cargo-mutest",
    "mutest-driver",
    "mutest-driver-cli",
    "mutest-emit",
    "mutest-exit-code",
    "mutest-inspector",
    "mutest-json",
    "mutest-operators",
    "mutest-runtime",
    "mutest-runtime-embedded-target-stub",
    "mutest-runtime-embedded-host-driver",
    "test-metadata-shim",
    "tests",
]

# Clippy has never run over this tree, so only a narrow set is switched on; the default
# groups still apply at their own levels.
[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
inefficient_to_string = "warn"
mem_forget = "warn"
rc_buffer = "warn"

[profile.release]
# No `strip`: the driver installs an ICE hook and the runtime is linked into users' test
# binaries, so both need their frames to survive into a backtrace.
#
# No `lto`: under LTO Cargo builds the runtime rlib as LLVM bitcode alone, which a user's linker
# cannot link into a test binary unless it has LLVM's plugin. `mutest-driver`'s build script
# refuses such an rlib.
codegen-units = 1
