name: tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      records:
        description: "Take the first macOS and Windows records of coverage, crap and binsize"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Rust toolchain specified in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustc --version

      - name: Install clippy
        run: rustup component add clippy

      # The driver's build script embeds the runtime rlib, which has to exist first.
      - name: Build mutest-runtime
        run: cargo build -p mutest-runtime

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  # Every enabled gate: bin/test, bin/coverage, and the `commands` of .chock/config.json.
  chock:
    name: chock (${{ matrix.os }})
    if: ${{ !inputs.records }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "ubuntu-latest" }
          # These gates keep a record for each system, and the `records` run writes the first one.
          - { os: "macos-latest", skip: "--skip=coverage,crap,binsize" }
          - { os: "windows-latest", skip: "--skip=coverage,crap,binsize" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    env:
      # bin/test and bin/coverage each build the driver, which can take longer than chock's default of 30 minutes.
      CHOCK_TIMEOUT: 5400

    defaults:
      run:
        shell: bash

    steps:
      # The gates that read the commit compare HEAD with its parent.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Install Rust toolchain specified in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustc --version

      # bin/test, bin/coverage and the gates that build each keep a target directory of their own.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Only the tools of the enabled gates: `chock init --global` also builds cargo-mutest, which bin/test builds from here.
      - name: Install chock and the tools of the enabled gates
        run: |
          . ./tool-versions.env
          cargo binstall -y --locked chock@"$CHOCK_VERSION" cargo-llvm-cov@"$CARGO_LLVM_COV_VERSION" cargo-crap@"$CARGO_CRAP_VERSION" \
            cargo-deny@"$CARGO_DENY_VERSION" cargo-sort@"$CARGO_SORT_VERSION" cargo-machete@"$CARGO_MACHETE_VERSION" \
            cargo-bsize@"$CARGO_BSIZE_VERSION" typos-cli@"$TYPOS_CLI_VERSION"

      - name: Run every enabled gate
        run: chock run --ci ${{ matrix.skip }}

  # Run by hand to take the first macOS and Windows records of the gates that keep one for each system.
  records:
    name: records (${{ matrix.os }})
    if: ${{ inputs.records }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "macos-latest", system: "macos" }
          - { os: "windows-latest", system: "windows" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    env:
      CHOCK_TIMEOUT: 5400

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Install Rust toolchain specified in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustc --version

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install chock and the tools of the recorded gates
        run: |
          . ./tool-versions.env
          cargo binstall -y --locked chock@"$CHOCK_VERSION" cargo-llvm-cov@"$CARGO_LLVM_COV_VERSION" cargo-crap@"$CARGO_CRAP_VERSION" \
            cargo-bsize@"$CARGO_BSIZE_VERSION"

      # Outside CI, a run writes the first record of each gate that has none.
      - name: Take the first records
        run: chock run coverage crap binsize

      - name: Upload the records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chock-records-${{ matrix.system }}
          path: |
            .chock/baseline.json
            .chock/crap-baseline@${{ matrix.system }}.json
          if-no-files-found: error
          retention-days: 7
