name: tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Rust toolchain specified in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustc --version

      - name: Install clippy
        run: rustup component add clippy

      # The driver's build script embeds the runtime rlib, which has to exist first.
      - name: Build mutest-runtime
        run: cargo build -p mutest-runtime

      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  # The TLA+ specs of proofs/tla: TLC and Apalache give the same answer on every OS, so one runs them.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install TLC and Apalache
        run: bash bin/setup tla

      - name: Check the specs
        run: bash bin/tla

  # Every enabled gate: bin/test, bin/coverage, and the `commands` of .chock/config.json.
  chock:
    name: chock (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: "ubuntu-latest" }
          - { os: "macos-latest" }
          - { os: "windows-latest" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    env:
      # bin/test and bin/coverage each build the driver, which can take longer than chock's default of 30 minutes.
      CHOCK_TIMEOUT: 5400

    defaults:
      run:
        shell: bash

    steps:
      # The gates that read the commit compare HEAD with its parent.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # bin/test, bin/coverage and the gates that build each keep a target directory of their own.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      # Only the tools of the enabled gates: `chock init --global` also builds cargo-mutest, which bin/test builds from here.
      - name: Install the toolchain, chock and the tools of the enabled gates
        run: bash bin/setup gates

      - name: Run every enabled gate
        run: chock run --ci
