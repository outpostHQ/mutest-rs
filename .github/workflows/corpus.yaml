name: corpus

# Builds the mutated test harness of real crates, each pinned to a release commit, and runs the analysis of the small ones.
# A gap in printing the mutated crate shows here as a crate that does not build. bin/corpus holds the crates.
on:
  push:
    branches:
      - "main"
    paths:
      - "rust-toolchain.toml"
      - "Cargo.lock"
      - "cargo-mutest/**"
      - "mutest-*/**"
      - "bin/corpus"
      - ".github/workflows/corpus.yaml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

# A new push ends the run of the push before it, so two runs do not compete for runners.
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-harness:
    name: ${{ matrix.crate }} (${{ matrix.os }})

    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        crate: ["tokio", "serde", "pest", "libp2p", "iroh", "quinn", "hyper", "tonic", "block2", "windows-core", "progenitor", "itoa", "base64", "anyhow"]
        exclude:
          - { crate: "block2", os: "ubuntu-latest" }
          - { crate: "block2", os: "windows-latest" }
          - { crate: "windows-core", os: "ubuntu-latest" }
          - { crate: "windows-core", os: "macos-latest" }

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install Rust toolchain specified in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustc --version

      - name: Run mutest on ${{ matrix.crate }}
        shell: bash
        run: bash bin/corpus "${{ matrix.crate }}"

      - name: Upload the analysis log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: analysis-${{ matrix.crate }}-${{ matrix.os }}
          path: target/corpus/${{ matrix.crate }}/analysis.log
          if-no-files-found: ignore
          retention-days: 7
