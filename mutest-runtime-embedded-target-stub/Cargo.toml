# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "mutest-runtime-embedded-target-stub"
version = "0.0.0"
authors = ["Zalán Bálint Lévai"]
description = "Mutation testing runtime embedded target stub for mutest-rs."
keywords = ["mutation", "mutation-analysis", "mutation-testing", "testing"]
categories = ["development-tools::testing", "development-tools::cargo-plugins", "security"]
homepage = "https://mutest.rs"
repository = "https://github.com/zalanlevai/mutest-rs"
license = "Apache-2.0 OR MIT"
edition = "2024"

# FIXME: rustc requires libraries in the search path to be in rlib format. Once proper dependency
#        resolution in generated code is implemented, cargo might be able to inject the crate for us.
[lib]
crate-type = ["rlib"]

[dependencies]
# Mutated crates reach phf only through `static_map!`, which re-exports it, so they need no extern for it.
__mutest_runtime_public_dep_phf = { package = "phf", version = "0.14", features = ["macros"], default-features = false }

mutest-edition-2021 = { path = "../mutest-edition-2021" }

[lints]
workspace = true
